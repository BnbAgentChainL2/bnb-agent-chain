[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
# via-IR is required: AgentRegistry compiles to 22,358 bytes of runtime code, leaving 2,218
# bytes under the EIP-170 limit of 24,576. Without via-IR it does not fit.
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 48
depth = 80
fail_on_revert = false

# Fork tests are opt-in: `forge test --match-contract Fork --fork-url $BSC_RPC_URL`
[rpc_endpoints]
bsc = "https://bsc-dataseed.bnbchain.org"
bsc_testnet = "https://data-seed-prebsc-1-s1.binance.org:8545"
