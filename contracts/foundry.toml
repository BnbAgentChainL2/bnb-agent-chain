[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
# via-IR is required by BacBridge, the largest contract here. Re-measured 2026-09-23 after the
# split into BacBridge + BacBridgeExtension (the extension holds settleEpoch, the owner powers,
# the watchdog tools and the halt / escape path, reached by DELEGATECALL): with via-IR at
# optimizer_runs = 200, BacBridge is 22,350 bytes of runtime code (2,226 below the EIP-170 limit
# of 24,576) and BacBridgeExtension 19,486. Without via-IR they are 25,399 (823 OVER, refused
# by EIP-170) and 22,213; the pre-v2 BacBridge did not compile at all without it (stack too
# deep). Every other contract fits either way (ValidatorStaking 16,925 / 19,383 bytes).
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]
# No `gas_limit` override: forge's default per-call test gas cap of 2**30 is enough. Re-measured
# 2026-09-23 with FOUNDRY_GAS_LIMIT=1073741824 — the whole non-fork suite (324 tests) and the
# fork + smoke suites (14 tests) pass. Heaviest: BacBridge.t.sol's two 30-day loops (4,320
# settleEpoch calls each) at ~210M / ~213M gas, the fork suite's plainPortalGuardsAndGaps at
# ~50M, and the fork setUp's in-EVM ...7777 vanity search at ~634 gas per try, 65,536 tries
# expected (~42M gas; hitting 2**30 would take ~1.69M tries, p ~ 6e-12). The override that used
# to sit here was set for a proof-of-work loop that decision #31 deleted.

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 48
depth = 80
fail_on_revert = false

# Fork tests are NOT opt-in: test/BacForkLaunch.t.sol and test/smoke/* fork BSC mainnet on their
# own (BSC_RPC_URL, falling back to the public https://bsc-dataseed.bnbchain.org), so a bare
# `forge test` forks too. Without them:
#   forge test --no-match-path 'test/{BacForkLaunch.t.sol,smoke/*}'
[rpc_endpoints]
bsc = "https://bsc-dataseed.bnbchain.org"
bsc_testnet = "https://data-seed-prebsc-1-s1.binance.org:8545"
